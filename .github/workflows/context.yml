name: Context and contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run docs:lint
      - run: npm run docs:test
      - run: npm run context:lint
      - run: npm run context:check
      - run: npm run context:test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:foundation
      - run: npm run test:prototype
      - run: npm run contracts:test
