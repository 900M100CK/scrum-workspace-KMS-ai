name: Context and contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run context:lint
      - run: npm run context:check
      - run: npm run context:test
