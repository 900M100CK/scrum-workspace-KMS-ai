name: scrum-kms-store
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run db:init first}
      WORKSPACE_DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:?Run npm run db:init first}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Run npm run db:init first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
      - ./bootstrap.sql:/bootstrap.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d knowledge_db && test -f /var/lib/postgresql/data/kms-bootstrap-complete"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
